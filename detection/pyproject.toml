[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scalper-detector"
version = "0.3.0"
description = "Ticket-scalper risk scoring from payment activity across ticketing sites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
deploy = ["onnx>=1.17,<2", "onnxruntime>=1.20,<2"]

[project.scripts]
scalper-detector = "scalper_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
