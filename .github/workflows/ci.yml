name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.17.1,<0.18"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.extras }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            extras: dev,api
          - os: ubuntu-latest
            python: "3.13"
            extras: dev,api,deploy
          - os: windows-latest
            python: "3.13"
            extras: dev,api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: detection/pyproject.toml
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e "./detection[${{ matrix.extras }}]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q
